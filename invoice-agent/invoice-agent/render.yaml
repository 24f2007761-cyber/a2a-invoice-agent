services:
  - type: web
    name: invoice-agent-a2a
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: AIPIPE_TOKEN
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: 3.12.3
